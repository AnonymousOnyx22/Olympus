# electron-builder configuration for Kern, a local desktop tool. Run `npm run dist`
# (or build:win / build:mac / build:linux) after `npm run build`. Builds are unsigned.
appId: com.kern.app
productName: Kern
copyright: Copyright (c) 2026 Nick

directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - dist-electron/**/*
  - build/icon.*
  - package.json
asar: true

mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch: [x64, arm64]
  icon: build/icon.png
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.inherit.mac.plist
  darkModeSupport: true
  notarize: false

win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  runAfterFinish: true
  deleteAppDataOnUninstall: false
  shortcutName: Kern

linux:
  category: Development
  icon: build/icon.png
  target:
    - target: AppImage
      arch: [x64]
  desktop:
    entry:
      Name: Kern
      Comment: Manage coding agents across your projects
      Categories: Development;IDE;
      StartupWMClass: Kern

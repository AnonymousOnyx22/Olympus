<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Little Notes</title><link rel="stylesheet" href="styles.css"></head><body><header><strong>little notes.</strong><span id="count"></span></header><h1>A little room<br>for your thoughts.</h1><p>Keep the ideas you want to come back to.</p><label>Find a note<input id="search" type="search" placeholder="Search your notes"></label><form id="note-form"><label>Title<input id="title" maxlength="80" required placeholder="An idea worth keeping"></label><label>Note<textarea id="body" maxlength="1500" required placeholder="Start anywhere..."></textarea></label><div class="row"><button type="submit">Save note</button><button type="button" id="cancel" hidden>Cancel edit</button></div></form><output id="notice" role="status"></output><div id="notes"></div><footer>Saved in this browser. Your space to think.</footer><script src="app.js"></script></body></html>

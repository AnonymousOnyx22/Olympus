<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Weekend Club</title><link rel="stylesheet" href="styles.css"></head><body><header><strong>weekend club.</strong><small>Make time for a little adventure</small></header><h1>Two days.<br>So many possibilities.</h1><p>A simple plan for getting out, slowing down, and trying something new.</p><div class="row"><button data-day="Saturday" aria-pressed="true">Saturday</button><button data-day="Sunday" aria-pressed="false">Sunday</button></div><output id="progress" role="status"></output><div id="plans"></div><h2>Add a little adventure</h2><form id="plan-form"><label>What are you planning?<input id="activity" required maxlength="100" placeholder="A walk by the lake"></label><div class="row"><label>Time<input id="time" type="time" value="10:00" required></label><label>Day<select id="day"><option>Saturday</option><option>Sunday</option></select></label></div><button>Add to the weekend</button></form><output id="notice" role="status"></output><footer>Your plans stay in this browser.</footer><script src="app.js"></script></body></html>

<!doctype html>
<meta charset="utf-8">
<title>Kern advert: nothing starts until you ask</title>
<style>html,body{margin:0;background:#121212}canvas{display:block}</style>
<canvas id="c" width="1080" height="1920"></canvas>
<script src="lib.js"></script>
<script>
const DURATION = 15

function statusCard(t, alpha) {
  const k = outCubic(ramp(t, 3.4, 0.8)); if (k <= 0) return
  const px = 90, w = 900, py = 640 + (1 - k) * 160, h = 760
  x.save(); x.globalAlpha = alpha * k
  rrect(px, py, w, h, 30); x.fillStyle = PANE; x.fill(); x.lineWidth = 2; x.strokeStyle = LINE; x.stroke()
  mark(px + 80, py + 76, 64, 1); text('Kern', px + 130, py + 94, 44, 800, TEXT, 1, 'left')
  x.fillStyle = LINE; x.fillRect(px, py + 140, w, 2)

  const started = t > 7.0
  // status line
  const col = started ? OK : '#6b6b6b'
  x.globalAlpha = alpha * k; x.fillStyle = col; x.beginPath(); x.arc(px + 70, py + 220, 14, 0, 7); x.fill()
  text(started ? (t > 8.2 ? 'Agent working' : 'Ready') : 'Not started', px + 105, py + 233, 40, 600, started ? TEXT : MUTED, alpha * k, 'left')
  text(started ? 'Started because you asked' : 'Opening Kern starts nothing', px + 70, py + 300, 32, 400, MUTED, alpha * k, 'left')

  // the one button
  const press = clamp(1 - Math.abs(t - 6.8) / 0.12)
  x.save(); x.translate(px + w / 2, py + 450); x.scale(1 - 0.06 * press, 1 - 0.06 * press)
  rrect(-380, -52, 760, 104, 26); x.fillStyle = started ? '#2a2a2a' : VIOLET; x.fill()
  text(started ? 'Agent 1 is on it' : '+ Add agent', 0, 14, 42, 700, started ? OK : '#101010', alpha * k)
  x.restore()

  // three glowing dots once an agent works
  if (t > 8.2) for (let d = 0; d < 3; d++) {
    const g = 0.25 + 0.75 * Math.max(0, Math.sin(t * 5.2 - d * 0.9))
    x.globalAlpha = alpha * k * g; x.fillStyle = LAV; x.beginPath(); x.arc(px + w / 2 - 40 + d * 40, py + 600, 11, 0, 7); x.fill()
  }
  x.restore()
}

function draw(t) {
  x.clearRect(0, 0, W, H); x.fillStyle = '#121212'; x.fillRect(0, 0, W, H)
  dotGrid(t)
  const s1 = 1 - ramp(t, 3.0, 0.5)
  if (s1 > 0) {
    ;[['Open Kern.', 0.3, TEXT], ['Nothing starts.', 1.3, LAV]].forEach(([s, at, col], i) => {
      const k = outCubic(ramp(t, at, 0.6)); text(s, W / 2, 800 + i * 140 + (1 - k) * 40, i ? 84 : 76, 700, col, k * s1)
    })
  }
  const f2 = ramp(t, 3.2, 0.5) * (1 - ramp(t, 9.6, 0.6))
  if (f2 > 0) {
    text('Models start', W / 2, 300, 92, 800, TEXT, f2)
    text('when you ask.', W / 2, 410, 92, 800, VIOLET, f2)
    text('Only when a task needs one.', W / 2, 500, 36, 400, MUTED, f2)
    statusCard(t, 1 - ramp(t, 9.6, 0.6))
  }
  const f3 = ramp(t, 10.1, 0.5) * (1 - ramp(t, 12.4, 0.5))
  if (f3 > 0) {
    mark(W / 2, 560, 200 * outBack(ramp(t, 10.1, 0.8)), f3)
    ;['No telemetry.', 'Keys encrypted on your computer.', 'Projects and chats stay put.'].forEach((s, i) => {
      const q = outCubic(ramp(t, 10.6 + i * 0.45, 0.5))
      const y = 860 + i * 130
      x.save(); x.globalAlpha = q * f3; x.strokeStyle = OK; x.lineWidth = 7; x.lineCap = 'round'; x.beginPath(); x.moveTo(110, y - 14); x.lineTo(140, y + 14); x.lineTo(190, y - 36); x.stroke(); x.restore()
      text(s, 230, y + 12, 50, 600, TEXT, q * f3, 'left')
    })
    text('Kern. Every agent. One workspace.', W / 2, 1380, 42, 400, MUTED, f3)
  }
  endCard(t, 12.9)
}
window.draw = draw; window.DURATION = DURATION
</script>

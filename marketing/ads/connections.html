<!doctype html>
<meta charset="utf-8">
<title>Kern advert: save a key once</title>
<style>html,body{margin:0;background:#121212}canvas{display:block}</style>
<canvas id="c" width="1080" height="1920"></canvas>
<script src="lib.js"></script>
<script>
const DURATION = 15
const KEYS = [['AI model key', 'Anthropic, OpenAI and more'], ['Payments key', 'Stripe'], ['Email key', 'Transactional email'], ['Hosting key', 'Deploys']]
const PROJECTS = ['Landing page', 'Notes API', 'Budget tracker']
// which project chips are switched on, and when
const ON = { 0: [5.6, 6.1], 1: [6.6, null], 2: [null, null] }

function card(t, alpha) {
  const k = outCubic(ramp(t, 3.4, 0.8)); if (k <= 0) return
  const px = 70, w = 940, py = 600 + (1 - k) * 160, h = 1000
  x.save(); x.globalAlpha = alpha * k
  rrect(px, py, w, h, 30); x.fillStyle = PANE; x.fill(); x.lineWidth = 2; x.strokeStyle = LINE; x.stroke()
  text('Connections', px + 40, py + 78, 40, 800, TEXT, 1, 'left')
  x.fillStyle = LINE; x.fillRect(px, py + 116, w, 2)
  KEYS.forEach(([name, sub], i) => {
    const q = outCubic(ramp(t, 4.2 + i * 0.2, 0.45)); if (q <= 0) return
    const y = py + 150 + i * 106
    x.globalAlpha = alpha * k * q
    rrect(px + 30, y, w - 60, 90, 20); x.fillStyle = '#181818'; x.fill()
    // padlock
    x.strokeStyle = LAV; x.lineWidth = 4; x.beginPath(); x.arc(px + 78, y + 36, 11, Math.PI, 0); x.stroke()
    rrect(px + 64, y + 36, 28, 22, 5); x.fillStyle = LAV; x.fill()
    text(name, px + 115, y + 42, 32, 700, TEXT, 1, 'left')
    text(sub, px + 115, y + 76, 24, 400, MUTED, 1, 'left')
    rrect(px + w - 250, y + 22, 200, 46, 23); x.fillStyle = 'rgba(52,211,153,.14)'; x.fill()
    text('Encrypted', px + w - 150, y + 54, 24, 600, OK, 1)
  })
  // who gets the AI model key
  const gy = py + 150 + 4 * 106 + 20
  text('Given only to the projects you allow', px + 40, gy + 30, 30, 600, MUTED, alpha * k * ramp(t, 5.0, 0.4), 'left')
  PROJECTS.forEach((name, i) => {
    const on = ON[i][0] != null && t >= ON[i][0] && !(ON[i][1] != null && t >= ON[i][1] && i === 0 && false)
    const cx = px + 40 + i * 300, cy = gy + 60
    const pop = on ? 1 + 0.06 * clamp(1 - (t - ON[i][0]) / 0.3) : 1
    x.save(); x.globalAlpha = alpha * k * ramp(t, 5.0, 0.4); x.translate(cx + 135, cy + 40); x.scale(pop, pop)
    rrect(-135, -40, 270, 80, 40); x.fillStyle = on ? 'rgba(139,123,255,.28)' : 'rgba(255,255,255,.06)'; x.fill(); x.lineWidth = 2; x.strokeStyle = on ? VIOLET : LINE; x.stroke()
    text(name, 0, 10, 28, 600, on ? TEXT : MUTED, 1)
    x.restore()
  })
  x.restore()
}

function draw(t) {
  x.clearRect(0, 0, W, H); x.fillStyle = '#121212'; x.fillRect(0, 0, W, H)
  dotGrid(t)
  const s1 = 1 - ramp(t, 3.0, 0.5)
  if (s1 > 0) {
    ;[['API keys everywhere?', 0.3, TEXT], ['Pasted into every project.', 1.3, LAV]].forEach(([s, at, col], i) => {
      const k = outCubic(ramp(t, at, 0.6)); text(s, W / 2, 850 + i * 160 + (1 - k) * 40, i ? 62 : 76, 700, col, k * s1)
    })
  }
  const f2 = ramp(t, 3.2, 0.5) * (1 - ramp(t, 9.8, 0.6))
  if (f2 > 0) {
    text('Save a key once.', W / 2, 300, 92, 800, TEXT, f2)
    text('Choose who gets it.', W / 2, 410, 92, 800, VIOLET, f2)
    text('Encrypted by your operating system.', W / 2, 500, 36, 400, MUTED, f2)
    card(t, 1 - ramp(t, 9.8, 0.6))
  }
  const f3 = ramp(t, 10.3, 0.5) * (1 - ramp(t, 12.4, 0.5))
  if (f3 > 0) {
    mark(W / 2, 700, 260 * outBack(ramp(t, 10.3, 0.8)), f3)
    text('One place for keys.', W / 2, 1000, 90, 800, TEXT, f3)
    text('Only where needed.', W / 2, 1110, 90, 800, VIOLET, f3)
    text('Kern. Every agent. One workspace.', W / 2, 1260, 42, 400, MUTED, f3)
  }
  endCard(t, 12.9)
}
window.draw = draw; window.DURATION = DURATION
</script>

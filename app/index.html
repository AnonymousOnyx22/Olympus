<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A clear workspace for independent AI agents."
    />
    <meta name="color-scheme" content="dark" />
    <title>Kern</title>
    <style>
      /* Shown until the app mounts, so startup never flashes an empty window. React replaces it. */
      body { margin: 0; background: #181818; }
      .splash { position: fixed; inset: 0; display: grid; place-items: center; font-family: 'Segoe UI', system-ui, sans-serif; color: #f2f2f2; }
      .splash > div { width: 20rem; max-width: calc(100vw - 3rem); }
      .splash-brand { display: flex; align-items: center; gap: 0.75rem; font-size: 24px; font-weight: 600; }
      .splash-bar { margin-top: 3.4rem; height: 4px; background: #333; overflow: hidden; }
      .splash-bar::after { content: ''; display: block; height: 100%; width: 30%; background: #f2f2f2; animation: splash-slide 1.2s ease-in-out infinite; }
      @keyframes splash-slide { from { transform: translateX(-100%); } to { transform: translateX(340%); } }
      @media (prefers-reduced-motion: reduce) { .splash-bar::after { animation: none; width: 100%; opacity: 0.4; } }
    </style>
  </head>
  <body class="bg-midnight text-slate-900">
    <div id="root"><div class="splash"><div>
      <div class="splash-brand"><svg width="32" height="32" viewBox="0 0 40 40" fill="none" aria-hidden="true"><path d="M9 7v26M30 7 17 20l13 13" stroke="#f2f2f2" stroke-width="4"/><path d="M9 20h8" stroke="#f2f2f2" stroke-width="4"/></svg>Kern</div>
      <div class="splash-bar" role="progressbar" aria-label="Starting Kern"></div>
    </div></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
